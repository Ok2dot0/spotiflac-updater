version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # These crates are tightly coupled and minor bumps have been breaking.
      # Upgrade them deliberately together, with code changes and a live test.
      - dependency-name: "proton-sdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "proton-drive-rs"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
