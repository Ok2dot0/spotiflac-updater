name: Bug report
description: Report a reproducible problem with the updater or installer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Do not paste Proton Drive share URLs, the part after `#`, or any other
        secret.** Replace them with placeholders.

  - type: input
    id: version
    attributes:
      label: Updater version
      description: Output of `spotiflac-update --version`.
      placeholder: spotiflac-updater 1.0.0
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - aarch64
        - Other
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: Fedora 45, Ubuntu 24.04, Arch Linux, ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact commands, with secrets redacted.
      placeholder: |
        1. Run `spotiflac-update --list '<redacted-url>'`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant output
      description: Redact secrets and personal paths if needed.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed all Proton Drive URLs, passwords, and secrets from this report.
          required: true
